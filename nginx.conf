server {
    listen 80;
    server_name localhost; # Cambiar a tu dominio en producción

    location / {
        # El servicio 'frontend' en docker-compose ahora es un Nginx escuchando en el puerto 80
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cabeceras de seguridad básicas
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always; # Ejemplo, ajustar según necesidades
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always; # Ajustar según funcionalidades usadas
    }

    location /api/ {
        proxy_pass http://backend:5000/; # El backend service definido en docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # Cabeceras de seguridad para la API (pueden ser diferentes si es necesario)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Para WebSockets, que ahora también pasan por /api/socket.io/ si el backend está configurado así,
    # o directamente si la URL de conexión de socket.io es /socket.io/
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/; # El backend service definido en docker-compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # En producción, deberías configurar HTTPS:
    # listen 443 ssl;
    # server_name tu_dominio.com;

    # ssl_certificate /etc/nginx/ssl/tu_dominio.com.crt; # Ruta a tu certificado SSL
    # ssl_certificate_key /etc/nginx/ssl/tu_dominio.com.key; # Ruta a tu clave privada

    # # Configuraciones SSL recomendadas
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;

    # # Redireccionar HTTP a HTTPS (opcional pero recomendado)
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }
}
